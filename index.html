<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TextureSAM-2 RWTD Results</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", "Segoe UI", sans-serif;
      color: #13222c;
      background: linear-gradient(180deg, #f7fafc 0%, #eef3f6 100%);
    }
    .wrap {
      width: min(1040px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 44px 0;
    }
    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid #d6dfe6;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 14px 36px rgba(19,34,44,.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.02;
    }
    p {
      margin: 0;
      color: #60707d;
      line-height: 1.65;
      max-width: 860px;
    }
    a.btn {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #12222d;
      background: #ffffff;
      border: 1px solid #d6dfe6;
      border-radius: 18px;
      padding: 16px 20px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>TextureSAM-2 RWTD Results</h1>
      <p>The public site currently exposes only the final RWTD visual results gallery: all 256 RWTD images, ground-truth masks, reproduced TextureSAM masks where available, and TextureSAM-2 AI-only predictions.</p>
      <a class="btn" href="./texturesam2_ai_gallery/index.html">Open RWTD Gallery</a>
    </section>
  </main>
</body>
</html>
