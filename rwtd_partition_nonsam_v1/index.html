<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RWTD Partition Non-SAM v1</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#11263d;--muted:#526983;--line:#d8e1ec;--accent:#0d5f86;--good:#0d8a49;--warn:#9a6a00}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(160deg,#eef3fb,#f9fcff);color:var(--ink);font-family:"Avenir Next","Helvetica Neue",system-ui,sans-serif}
    .wrap{max-width:1600px;margin:0 auto;padding:18px 14px 32px}
    .hero{background:linear-gradient(120deg,#0b3150,#0b628b 52%,#12917c);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px}
    .hero h1{margin:0 0 6px;font-size:27px}
    .hero p{margin:0;color:#d8efff;font-size:14px}
    .links{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 12px;border:1px solid #ffffff42;border-radius:8px;color:#fff;text-decoration:none;background:#ffffff12;font-size:13px}
    .btn:hover{background:#ffffff22}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px;margin-bottom:12px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
    .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .value{margin-top:4px;font-size:24px;font-weight:700;line-height:1.1}
    .delta{margin-top:4px;font-size:12px;font-weight:700}
    .up{color:var(--good)}
    .down{color:#a23d3d}
    .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:10px}
    .controls{position:sticky;top:8px;z-index:4;background:#ffffffdb;backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:10px}
    label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
    input,select{height:34px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff;color:var(--ink)}
    .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:8px 2px 10px;gap:8px;flex-wrap:wrap}
    .table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .table th,.table td{padding:8px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}
    .table th{background:#f3f8fd;color:var(--muted);font-weight:700}
    .table tr:hover{background:#f8fbff}
    .grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
    .sample{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
    .sample-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .id{font-weight:700;font-size:14px}
    .metrics{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
    .metrics b{color:var(--ink)}
    .quad{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
    .panel{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f4f8fc}
    .panel .t{font-size:11px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);background:#fff}
    .panel img{width:100%;display:block;aspect-ratio:1/1;object-fit:contain;background:#eef3f7}
    .empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted)}
    @media (max-width:1200px){.cards{grid-template-columns:repeat(2,minmax(160px,1fr))}.controls{grid-template-columns:repeat(3,minmax(120px,1fr))}}
    @media (max-width:760px){.controls{grid-template-columns:repeat(2,minmax(120px,1fr))}.quad{grid-template-columns:1fr}.hero h1{font-size:22px}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>RWTD Partition-First Non-SAM v1</h1>
      <p>Stage1 STMD -> Stage2 ADE500 binary tasks. TextureSAM-compatible RWTD inversion rule. No SAM/SAM-2 used.</p>
      <div class="links">
        <a class="btn" href="../index.html">Home</a>
        <a class="btn" href="./metrics/graph_summary.json">Graph Summary JSON</a>
        <a class="btn" href="./metrics/graph_non_aggregated.csv">Graph Non-Agg CSV</a>
        <a class="btn" href="./metrics/watershed_non_aggregated.csv">Watershed Non-Agg CSV</a>
      </div>
    </section>

    <section class="cards" id="cards"></section>

    <div class="note" id="note">Loading...</div>

    <section class="controls">
      <label>Search Sample ID<input id="q_id" type="text" placeholder="rwtd_16" /></label>
      <label>Display Run
        <select id="q_run">
          <option value="graph">graph</option>
          <option value="watershed">watershed</option>
          <option value="off">off</option>
        </select>
      </label>
      <label>Sort
        <select id="q_sort">
          <option value="iou_desc">IoU (high to low)</option>
          <option value="iou_asc">IoU (low to high)</option>
          <option value="ari_desc">ARI (high to low)</option>
          <option value="id">sample_id</option>
        </select>
      </label>
      <label>Min IoU<input id="q_iou" type="number" min="0" max="1" step="0.01" value="0" /></label>
      <label>Show Rows<input id="q_n" type="number" min="5" max="256" step="1" value="24" /></label>
    </section>

    <div class="meta"><div id="count">Loading...</div><div id="runmeta"></div></div>

    <table class="table" id="runTable"></table>

    <section class="grid" id="grid"><div class="empty">Loading results...</div></section>
  </div>

  <script>
    const el = {
      cards: document.getElementById("cards"),
      note: document.getElementById("note"),
      count: document.getElementById("count"),
      runmeta: document.getElementById("runmeta"),
      table: document.getElementById("runTable"),
      grid: document.getElementById("grid"),
      id: document.getElementById("q_id"),
      run: document.getElementById("q_run"),
      sort: document.getElementById("q_sort"),
      iou: document.getElementById("q_iou"),
      n: document.getElementById("q_n"),
    };

    const state = { payload: null, rows: [] };

    function fmt(x, d=3){
      if (x === null || x === undefined || Number.isNaN(Number(x))) return "n/a";
      return Number(x).toFixed(d);
    }

    function renderCards(){
      const p = state.payload;
      const t = p.target || {};
      const runs = p.runs || {};
      const cards = ["off","watershed","graph"].map((name) => {
        const r = runs[name]?.non_aggregated || {};
        const miou = Number(r.miou || 0);
        const delta = miou - Number(t.texturesam_non_aggregated_miou || 0);
        return {
          label: `${name} non-agg mIoU`,
          value: fmt(miou,4),
          delta,
        };
      });
      cards.push({
        label: "TextureSAM target",
        value: fmt(t.texturesam_non_aggregated_miou, 2),
        delta: null,
      });

      el.cards.innerHTML = cards.map((c) => {
        const d = c.delta;
        const cls = d === null ? "" : (d >= 0 ? "up" : "down");
        const text = d === null ? "reference" : `vs target: ${(d>=0?"+":"") + d.toFixed(4)}`;
        return `<div class="card"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="delta ${cls}">${text}</div></div>`;
      }).join("");

      const stage1 = p.training?.stage1?.best_val_iou;
      const stage2 = p.training?.stage2?.best_val_iou;
      el.note.textContent = `Mapped data: ADE curated=${p.dataset_mapping?.curated_ade_entries}, ADE tasks=${p.dataset_mapping?.ade_tasks_generated}, STMD tasks=${p.dataset_mapping?.stmd_binary_tasks}, RWTD=${p.dataset_mapping?.rwtd_images}. Training best val IoU: stage1=${fmt(stage1,4)}, stage2=${fmt(stage2,4)}.`;
    }

    function renderRunTable(){
      const runs = state.payload.runs || {};
      const rows = ["off","watershed","graph"].map((name) => {
        const n = runs[name]?.non_aggregated || {};
        const a = runs[name]?.aggregated || {};
        return `<tr>
          <td><b>${name}</b></td>
          <td>${fmt(n.miou,4)}</td>
          <td>${fmt(n.ari,4)}</td>
          <td>${fmt(a.miou,4)}</td>
          <td>${fmt(a.ari,4)}</td>
          <td>${fmt(n.inversion_rate,4)}</td>
        </tr>`;
      }).join("");

      el.table.innerHTML = `
        <thead><tr>
          <th>Run</th><th>Non-Agg mIoU</th><th>Non-Agg ARI</th><th>Agg mIoU</th><th>Agg ARI</th><th>Inversion Rate</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      `;
    }

    function renderRows(){
      const idNeedle = String(el.id.value || "").trim().toLowerCase();
      const run = el.run.value;
      const sort = el.sort.value;
      const minIou = Number(el.iou.value || 0);
      const limit = Math.max(1, Math.min(256, Number(el.n.value || 24)));

      let rows = state.rows.filter((r) => {
        if (idNeedle && !String(r.image_id).toLowerCase().includes(idNeedle)) return false;
        const iou = Number(r.metrics?.[run]?.iou ?? 0);
        if (iou < minIou) return false;
        return true;
      });

      if (sort === "iou_desc") rows.sort((a,b) => Number(b.metrics?.[run]?.iou ?? 0) - Number(a.metrics?.[run]?.iou ?? 0));
      if (sort === "iou_asc") rows.sort((a,b) => Number(a.metrics?.[run]?.iou ?? 0) - Number(b.metrics?.[run]?.iou ?? 0));
      if (sort === "ari_desc") rows.sort((a,b) => Number(b.metrics?.[run]?.ari ?? 0) - Number(a.metrics?.[run]?.ari ?? 0));
      if (sort === "id") rows.sort((a,b) => String(a.image_id).localeCompare(String(b.image_id), undefined, {numeric:true}));

      const shown = rows.slice(0, limit);
      el.count.textContent = `Showing ${shown.length} / ${rows.length} filtered samples (${state.rows.length} total)`;
      const r = state.payload.runs?.[run]?.non_aggregated || {};
      el.runmeta.textContent = `run=${run} | non-agg mIoU=${fmt(r.miou,4)} | ARI=${fmt(r.ari,4)} | inversion=${fmt(r.inversion_rate,4)}`;

      if (!shown.length){
        el.grid.innerHTML = `<div class="empty">No samples match current filters.</div>`;
        return;
      }

      el.grid.innerHTML = shown.map((s) => {
        const mRun = s.metrics?.[run] || {};
        const mOff = s.metrics?.off || {};
        const mWs = s.metrics?.watershed || {};
        const mGraph = s.metrics?.graph || {};
        const pred = run === "off" ? s.pred_off : (run === "watershed" ? s.pred_watershed : s.pred_graph);

        return `
          <article class="sample">
            <div class="sample-top">
              <div class="id">${s.image_id}</div>
              <div class="metrics">
                <span>${run} IoU: <b>${fmt(mRun.iou,4)}</b></span>
                <span>${run} ARI: <b>${fmt(mRun.ari,4)}</b></span>
                <span>inv: <b>${Number(mRun.used_inversion||0)}</b></span>
                <span>off IoU: <b>${fmt(mOff.iou,4)}</b></span>
                <span>watershed IoU: <b>${fmt(mWs.iou,4)}</b></span>
                <span>graph IoU: <b>${fmt(mGraph.iou,4)}</b></span>
              </div>
            </div>
            <div class="quad">
              <div class="panel"><div class="t">Original</div><img loading="lazy" src="${s.original}" alt="${s.image_id} original" /></div>
              <div class="panel"><div class="t">GT Mask</div><img loading="lazy" src="${s.gt_mask}" alt="${s.image_id} gt" /></div>
              <div class="panel"><div class="t">Pred (${run})</div><img loading="lazy" src="${pred}" alt="${s.image_id} pred ${run}" /></div>
            </div>
          </article>
        `;
      }).join("");
    }

    function bind(){
      [el.id, el.run, el.sort, el.iou, el.n].forEach((n) => n.addEventListener("input", renderRows));
      el.run.addEventListener("change", renderRows);
      el.sort.addEventListener("change", renderRows);
    }

    async function load(){
      const res = await fetch("./results.json?v=" + Date.now());
      if (!res.ok) throw new Error("Failed to load results.json");
      const payload = await res.json();
      state.payload = payload;
      state.rows = Array.isArray(payload.samples) ? payload.samples : [];
      renderCards();
      renderRunTable();
      renderRows();
      bind();
    }

    load().catch((err) => {
      el.grid.innerHTML = `<div class="empty">Failed to load data: ${String(err.message || err)}</div>`;
      el.count.textContent = "Load failed";
      el.note.textContent = "Could not load results.json";
    });
  </script>
</body>
</html>
