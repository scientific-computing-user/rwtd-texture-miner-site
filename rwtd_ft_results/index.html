<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RWTD FT Results vs TextureSAM</title>
  <style>
    :root{
      --bg:#f2f7f5;
      --panel:#ffffff;
      --ink:#12202b;
      --muted:#4a6174;
      --line:#d3e1ea;
      --ok:#0f7a44;
      --bad:#9d2b34;
      --accent:#0c4a6e;
      --accent-2:#1b7f6a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--ink);
      background:radial-gradient(1000px 500px at 10% -10%, #d7f2ea 0%, transparent 65%),linear-gradient(165deg,#eef4fa,#f9fcfb);
      font-family:"Avenir Next","Helvetica Neue",system-ui,sans-serif;
    }
    .wrap{max-width:1700px;margin:0 auto;padding:20px 14px 28px}
    .top{
      background:linear-gradient(120deg,#093451,#0f5d7f 45%,#14826f);
      color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px;
      box-shadow:0 12px 26px #0b304625;
    }
    .top h1{margin:0 0 6px;font-size:27px;line-height:1.18}
    .top p{margin:0;font-size:14px;color:#dcf3ff}
    .top .links{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      height:34px;padding:0 12px;border-radius:8px;border:1px solid #ffffff42;
      color:#fff;text-decoration:none;background:#ffffff14;font-size:13px
    }
    .btn:hover{background:#ffffff22}
    .scorecards{
      display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));
      gap:10px;margin-bottom:12px;
    }
    .ktable{
      background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;
    }
    .ktable h3{margin:2px 0 8px;font-size:14px}
    .ktable table{width:100%;border-collapse:collapse;font-size:12px}
    .ktable th,.ktable td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
    .ktable tr:last-child td{border-bottom:0}
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;
    }
    .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .value{font-weight:700;font-size:22px;line-height:1.1;margin-top:4px}
    .delta{font-size:12px;margin-top:4px;font-weight:600}
    .delta.ok{color:var(--ok)}
    .delta.bad{color:var(--bad)}
    .controls{
      position:sticky;top:8px;z-index:4;background:#ffffffdb;backdrop-filter:blur(4px);
      border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;
      grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:12px;
    }
    label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
    input,select{
      height:34px;border-radius:8px;border:1px solid var(--line);
      padding:4px 8px;background:#fff;color:var(--ink)
    }
    .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:8px 2px 10px;gap:8px;flex-wrap:wrap}
    .note{
      background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
      color:var(--muted);font-size:13px;margin:0 0 12px;
    }
    .grid{display:grid;grid-template-columns:1fr;gap:10px}
    .sample{
      background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;
    }
    .sample-top{
      display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px
    }
    .id{font-weight:700;font-size:14px}
    .metrics{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
    .metrics b{color:var(--ink)}
    .quad{
      display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr));
    }
    .panel{
      border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f4f8fc
    }
    .panel .t{
      font-size:11px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);background:#fff
    }
    .panel img{
      width:100%;display:block;aspect-ratio:1/1;object-fit:contain;background:#eef3f7
    }
    .empty{
      background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted)
    }
    @media (max-width:1200px){
      .scorecards{grid-template-columns:repeat(3,minmax(130px,1fr))}
      .controls{grid-template-columns:repeat(3,minmax(120px,1fr))}
      .quad{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:760px){
      .scorecards{grid-template-columns:repeat(2,minmax(120px,1fr))}
      .controls{grid-template-columns:repeat(2,minmax(120px,1fr))}
      .top h1{font-size:22px}
      .quad{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="top">
      <h1>RWTD Fine-Tune Results: Texture K-Seg vs TextureSAM</h1>
      <p>Full-image inspection page: original image, ground-truth mask, predicted mask, and overlay for every evaluated RWTD sample.</p>
      <div class="links">
        <a class="btn" href="../index.html">Home</a>
        <a class="btn" href="../review/index.html">Review UI</a>
      </div>
    </section>

    <section class="scorecards" id="scorecards"></section>
    <section class="ktable" id="per_k_table"></section>

    <section class="controls">
      <label>Search Sample ID<input id="q_id" type="text" placeholder="rwtd_101" /></label>
      <label>Sort
        <select id="q_sort">
          <option value="id">sample_id</option>
          <option value="iouavg_desc">IoUavg (high to low)</option>
          <option value="iouavg_asc">IoUavg (low to high)</option>
          <option value="iouagg_desc">IoUagg (high to low)</option>
          <option value="ari_desc">ARI (high to low)</option>
        </select>
      </label>
      <label>IoUavg min<input id="q_iouavg" type="number" min="0" max="1" step="0.01" value="0" /></label>
      <label>IoUagg min<input id="q_iouagg" type="number" min="0" max="1" step="0.01" value="0" /></label>
      <label>ARI min<input id="q_ari" type="number" min="-1" max="1" step="0.01" value="-1" /></label>
      <label>View K
        <select id="q_viewk">
          <option value="2">K=2</option>
        </select>
      </label>
    </section>

    <div class="note" id="metric_note">Loading metric details...</div>

    <div class="meta">
      <div id="count">Loading...</div>
      <div id="runmeta"></div>
    </div>

    <section class="grid" id="grid">
      <div class="empty">Loading results...</div>
    </section>
  </div>

  <script>
    const el = {
      cards: document.getElementById("scorecards"),
      grid: document.getElementById("grid"),
      count: document.getElementById("count"),
      runmeta: document.getElementById("runmeta"),
      id: document.getElementById("q_id"),
      sort: document.getElementById("q_sort"),
      iouavg: document.getElementById("q_iouavg"),
      iouagg: document.getElementById("q_iouagg"),
      ari: document.getElementById("q_ari"),
      viewk: document.getElementById("q_viewk"),
      metricNote: document.getElementById("metric_note"),
      perKTable: document.getElementById("per_k_table"),
    };

    const state = { payload: null, rows: [], filtered: [] };

    function fmt(x, d=3){
      if (x === null || x === undefined || Number.isNaN(Number(x))) return "n/a";
      return Number(x).toFixed(d);
    }

    function deltaClass(v){
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "";
      return Number(v) >= 0 ? "ok" : "bad";
    }

    function deltaText(v){
      if (v === null || v === undefined || Number.isNaN(Number(v))) return "n/a";
      const n = Number(v);
      return (n >= 0 ? "+" : "") + n.toFixed(3);
    }

    function renderCards(){
      const p = state.payload;
      const s = p.summary || {};
      const b03 = (p.baseline || {}).texturesam_eta_le_0_3 || {};
      const b10 = (p.baseline || {}).texturesam_eta_le_1_0 || {};

      const dAvg03 = Number(s.IoUavg_mean) - Number(b03.iouavg);
      const dAgg03 = Number(s.IoUagg_mean) - Number(b03.iouagg);
      const dAri03 = Number(s.ARI_mean) - Number(b03.ari);
      const dAvg10 = Number(s.IoUavg_mean) - Number(b10.iouavg);
      const dAgg10 = Number(s.IoUagg_mean) - Number(b10.iouagg);
      const dAri10 = Number(s.ARI_mean) - Number(b10.ari);

      const cards = [
        {label: "Our IoUavg", value: fmt(s.IoUavg_mean), delta: "vs TextureSAM η<=0.3: " + deltaText(dAvg03), cls: deltaClass(dAvg03)},
        {label: "Our IoUagg", value: fmt(s.IoUagg_mean), delta: "vs TextureSAM η<=0.3: " + deltaText(dAgg03), cls: deltaClass(dAgg03)},
        {label: "Our ARI", value: fmt(s.ARI_mean), delta: "vs TextureSAM η<=0.3: " + deltaText(dAri03), cls: deltaClass(dAri03)},
        {label: "IoUavg Delta", value: deltaText(dAvg10), delta: "vs TextureSAM η<=1.0", cls: deltaClass(dAvg10)},
        {label: "IoUagg Delta", value: deltaText(dAgg10), delta: "vs TextureSAM η<=1.0", cls: deltaClass(dAgg10)},
        {label: "ARI Delta", value: deltaText(dAri10), delta: "vs TextureSAM η<=1.0", cls: deltaClass(dAri10)},
      ];

      el.cards.innerHTML = cards.map((c) => `
        <div class="card">
          <div class="label">${c.label}</div>
          <div class="value">${c.value}</div>
          <div class="delta ${c.cls}">${c.delta}</div>
        </div>
      `).join("");

      el.runmeta.textContent = `Samples: ${s.num_valid || 0}/${s.num_samples || 0} | Benchmark K=${s.K} | tau=${s.tau} | checkpoint=${(s.checkpoint || "").split("/").slice(-1)[0] || "n/a"}`;
      const note = s.note || "Metrics are strict K=2 by default.";
      const note2 = s.note_multik || "";
      const propAgg = s.IoUagg_prop_mean;
      el.metricNote.textContent = `${note} ${note2} Proposal-IoUagg (not benchmark): ${fmt(propAgg)}.`;
      renderPerKTable(s.per_k_metrics || {});
    }

    function renderPerKTable(perK){
      const keys = Object.keys(perK).sort((a,b) => Number(a) - Number(b));
      if (!keys.length){
        el.perKTable.innerHTML = "<h3>Per-K Metrics</h3><div>No per-K metrics available.</div>";
        return;
      }
      const body = keys.map((k) => {
        const r = perK[k] || {};
        return `<tr>
          <td>K=${k}</td>
          <td>${fmt(r.IoUavg_mean,4)}</td>
          <td>${fmt(r.IoUagg_mean,4)}</td>
          <td>${fmt(r.ARI_mean,4)}</td>
          <td>${Number(r.num_samples || 0)}</td>
        </tr>`;
      }).join("");
      el.perKTable.innerHTML = `
        <h3>Per-K Metrics (Strict)</h3>
        <table>
          <thead><tr><th>K</th><th>IoUavg</th><th>IoUagg</th><th>ARI</th><th>n</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    function renderRows(){
      const idNeedle = String(el.id.value || "").trim().toLowerCase();
      const minIouAvg = Number(el.iouavg.value || 0);
      const minIouAgg = Number(el.iouagg.value || 0);
      const minAri = Number(el.ari.value || -1);
      const viewK = Number(el.viewk.value || 2);
      const sort = el.sort.value;

      let rows = state.rows.filter((r) => {
        if (idNeedle && !String(r.sample_id).toLowerCase().includes(idNeedle)) return false;
        if (Number(r.iouavg) < minIouAvg) return false;
        if (Number(r.iouagg) < minIouAgg) return false;
        if (Number(r.ari) < minAri) return false;
        return true;
      });

      if (sort === "iouavg_desc") rows.sort((a,b) => Number(b.iouavg) - Number(a.iouavg));
      if (sort === "iouavg_asc") rows.sort((a,b) => Number(a.iouavg) - Number(b.iouavg));
      if (sort === "iouagg_desc") rows.sort((a,b) => Number(b.iouagg) - Number(a.iouagg));
      if (sort === "ari_desc") rows.sort((a,b) => Number(b.ari) - Number(a.ari));
      if (sort === "id") rows.sort((a,b) => String(a.sample_id).localeCompare(String(b.sample_id), undefined, {numeric:true}));

      state.filtered = rows;
      el.count.textContent = `Showing ${rows.length} / ${state.rows.length} samples`;

      if (!rows.length){
        el.grid.innerHTML = `<div class="empty">No samples match the current filters.</div>`;
        return;
      }

      el.grid.innerHTML = rows.map((r) => `
        <article class="sample">
          <div class="sample-top">
            <div class="id">${r.sample_id}</div>
            <div class="metrics">
              <span>IoUavg: <b>${fmt(r.iouavg,4)}</b></span>
              <span>IoUagg: <b>${fmt(r.iouagg,4)}</b></span>
              <span>ARI: <b>${fmt(r.ari,4)}</b></span>
            </div>
          </div>
          <div class="quad">
            <div class="panel"><div class="t">Original Image</div><img loading="lazy" src="${r.original}" alt="${r.sample_id} original" /></div>
            <div class="panel"><div class="t">Original Mask (GT)</div><img loading="lazy" src="${r.gt_mask}" alt="${r.sample_id} gt mask" /></div>
            <div class="panel"><div class="t">Predicted Mask (K=${viewK})</div><img loading="lazy" src="${r[`pred_mask_k${viewK}`] || r.pred_mask}" alt="${r.sample_id} predicted mask" /></div>
            <div class="panel"><div class="t">Overlayed Mask (K=${viewK})</div><img loading="lazy" src="${r[`overlay_k${viewK}`] || r.overlay}" alt="${r.sample_id} overlay" /></div>
          </div>
        </article>
      `).join("");
    }

    function bind(){
      [el.id, el.sort, el.iouavg, el.iouagg, el.ari, el.viewk].forEach((n) => n.addEventListener("input", renderRows));
      el.sort.addEventListener("change", renderRows);
      el.viewk.addEventListener("change", renderRows);
    }

    function initKOptions(payload){
      const ks = ((payload.summary || {}).available_K_views || [2]).map((x) => Number(x)).filter((x) => Number.isFinite(x));
      const uniq = [...new Set(ks)].sort((a,b) => a-b);
      el.viewk.innerHTML = uniq.map((k) => `<option value="${k}">K=${k}</option>`).join("");
      if (!uniq.includes(2)) {
        el.viewk.innerHTML = `<option value="2">K=2</option>` + el.viewk.innerHTML;
      }
      el.viewk.value = "2";
    }

    async function load(){
      const res = await fetch("./results.json?v=" + Date.now());
      if (!res.ok) throw new Error("Failed to load results.json");
      const payload = await res.json();
      state.payload = payload;
      state.rows = Array.isArray(payload.samples) ? payload.samples : [];
      initKOptions(payload);
      renderCards();
      renderRows();
      bind();
    }

    load().catch((err) => {
      el.grid.innerHTML = `<div class="empty">Failed to load data: ${String(err.message || err)}</div>`;
      el.count.textContent = "Load failed";
    });
  </script>
</body>
</html>
