<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>TexOW-SAM VLM-Freeform OpenWorldSAM RWTD v4 (Qwen3-VL)</title>
  <style>
    :root {
      --bg:#f2f7fb; --panel:#fff; --ink:#0f2337; --muted:#586d81; --line:#d5e0eb;
      --accent:#0f5fa8; --good:#0b8e4f; --bad:#a43a3a;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:linear-gradient(140deg,#eef4fa,#f8fbff); color:var(--ink); font-family: "Avenir Next","Segoe UI",system-ui,sans-serif; }
    .wrap { max-width: 1800px; margin: 0 auto; padding: 14px; }
    .hero { background:linear-gradient(110deg,#082b49,#0f5fa8 58%,#108087); color:#fff; border-radius:14px; padding:14px; }
    .hero h1 { margin:0 0 6px; font-size:26px; }
    .hero p { margin:0; font-size:13px; color:#d8eeff; }
    .links { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; justify-content:center; height:33px; padding:0 12px; border-radius:8px; border:1px solid #ffffff3d; text-decoration:none; color:#fff; background:#ffffff14; font-size:12px; }
    .btn:hover { background:#ffffff22; }
    .cards { margin-top:10px; display:grid; grid-template-columns:repeat(7,minmax(120px,1fr)); gap:8px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
    .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .v { margin-top:4px; font-size:22px; font-weight:700; line-height:1.05; }
    .d { margin-top:3px; font-size:11px; color:var(--muted); }
    .good { color:var(--good); }
    .bad { color:var(--bad); }
    .controls { position:sticky; top:8px; z-index:5; margin-top:10px; background:#ffffffdd; backdrop-filter:blur(4px); border:1px solid var(--line); border-radius:10px; padding:8px; display:grid; grid-template-columns:repeat(6,minmax(130px,1fr)); gap:8px; }
    label { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); }
    input,select { height:32px; border:1px solid var(--line); border-radius:8px; padding:4px 8px; background:#fff; color:var(--ink); }
    .meta { margin:8px 2px; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .grid { display:grid; gap:10px; }
    .sample { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .id { font-weight:700; font-size:14px; }
    .m { display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:12px; }
    .m b { color:var(--ink); }
    .quad { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:7px; }
    .panel { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#f4f9ff; }
    .panel .t { padding:5px 7px; font-size:10px; color:var(--muted); border-bottom:1px solid var(--line); background:#fff; }
    .panel img { width:100%; display:block; aspect-ratio:1 / 1; object-fit:contain; background:#edf4fb; }
    .desc { margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .box { border:1px solid var(--line); border-radius:8px; padding:8px; background:#fbfdff; }
    .box h4 { margin:0 0 6px; font-size:12px; }
    .box .sub { margin-top:4px; color:var(--muted); font-size:11px; }
    .list { margin:0; padding-left:18px; font-size:12px; }
    .list li { margin:2px 0; }
    .prompts { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { border:1px solid var(--line); border-radius:999px; padding:3px 8px; font-size:11px; background:#f4f9ff; }
    .prompt-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; margin-top:6px; }
    .pm { border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#fff; }
    .pm img { width:100%; display:block; aspect-ratio:1/1; object-fit:contain; background:#edf4fb; }
    .pm .c { font-size:10px; color:var(--muted); text-align:center; padding:3px; border-top:1px solid var(--line); }
    .empty { margin-top:10px; border:1px dashed var(--line); border-radius:10px; padding:14px; color:var(--muted); background:#fff; }
    @media (max-width: 1500px) { .cards { grid-template-columns:repeat(4,minmax(130px,1fr)); } .quad { grid-template-columns:repeat(4,minmax(0,1fr)); } .prompt-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    @media (max-width: 980px) { .cards,.controls { grid-template-columns:repeat(2,minmax(130px,1fr)); } .quad,.desc,.prompt-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .hero h1 { font-size:22px; } }
    @media (max-width: 640px) { .quad,.desc,.prompt-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>TexOW-SAM VLM-Freeform OpenWorldSAM RWTD v4 (Qwen3-VL)</h1>
      <p>Per-image view includes selected texture descriptions, per-prompt masks, merged labels, edges, and binary masks.</p>
      <div class="links">
        <a class="btn" href="../index.html">Home</a>
        <a class="btn" href="./results.json">Results JSON</a>
        <a class="btn" href="./metrics/rwtd_metrics.csv">Per-image CSV</a>
        <a class="btn" href="./eval_summary.json">Eval Summary</a>
      </div>
    </section>

    <section class="cards" id="cards"></section>
    <section class="controls">
      <label>Search image ID<input id="q_id" type="text" placeholder="rwtd_16" /></label>
      <label>Sort
        <select id="q_sort">
          <option value="rob_asc">Robust IoU (low to high)</option>
          <option value="rob_desc">Robust IoU (high to low)</option>
          <option value="bnd_asc">Boundary F1 (low to high)</option>
          <option value="bnd_desc">Boundary F1 (high to low)</option>
          <option value="id">Image ID</option>
        </select>
      </label>
      <label>Min robust IoU<input id="q_min" type="number" min="0" max="1" step="0.01" value="0" /></label>
      <label>Max robust IoU<input id="q_max" type="number" min="0" max="1" step="0.01" value="1" /></label>
      <label>Rows<input id="q_n" type="number" min="1" max="256" step="1" value="24" /></label>
      <label>Only inversion-used<input id="q_inv" type="checkbox" /></label>
    </section>

    <div class="meta">
      <div id="count">Loading...</div>
      <div id="meta">Loading...</div>
    </div>
    <section class="grid" id="grid"><div class="empty">Loading results...</div></section>
  </div>

  <script>
    const el = {
      cards: document.getElementById('cards'),
      id: document.getElementById('q_id'),
      sort: document.getElementById('q_sort'),
      min: document.getElementById('q_min'),
      max: document.getElementById('q_max'),
      n: document.getElementById('q_n'),
      inv: document.getElementById('q_inv'),
      count: document.getElementById('count'),
      meta: document.getElementById('meta'),
      grid: document.getElementById('grid'),
    };
    const state = { payload:null, rows:[] };

    function fmt(x, d=3) {
      if (x === null || x === undefined || Number.isNaN(Number(x))) return 'n/a';
      return Number(x).toFixed(d);
    }

    function esc(s) {
      return String(s || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    }

    function renderCards() {
      const p = state.payload || {};
      const s = p.summary || {};
      const ref = p.reference || {};
      const mRob = Number(s.mean_robust_iou || 0);
      const mB = Number(s.mean_boundary_f1 || 0);
      const mRaw = Number(s.mean_iou || 0);
      const mAgg = Number(s.mean_oracle_agg_iou_inv_robust || s.mean_agg_iou_inv_robust || 0);
      const tsNon = Number(ref.texturesam_non_agg_miou || 0.47);
      const tsAgg = Number(ref.texturesam_agg_miou || 0.75);
      const dNon = mRob - tsNon;
      const dAgg = mAgg - tsAgg;
      const cards = [
        {k:'Mean IoU (raw)', v:fmt(mRaw,4), d:'No inversion handling'},
        {k:'Mean IoU (robust)', v:fmt(mRob,4), d:`vs TextureSAM 0.47: ${(dNon>=0?'+':'') + dNon.toFixed(4)}`, cls:dNon>=0?'good':'bad'},
        {k:'Mean Boundary F1@2px', v:fmt(mB,4), d:'Boundary quality signal'},
        {k:'Oracle Agg Robust IoU', v:fmt(mAgg,4), d:`vs TextureSAM agg 0.75: ${(dAgg>=0?'+':'') + dAgg.toFixed(4)}`, cls:dAgg>=0?'good':'bad'},
        {k:'Median robust IoU', v:fmt(s.median_robust_iou,4), d:`Std ${fmt(s.std_robust_iou,4)}`},
        {k:'Images', v:String(s.num_rows || state.rows.length), d:`Run ${p.run_id || ''}`},
        {k:'VLM mode', v:'freeform', d:'Prompt text + per-prompt masks'}
      ];
      el.cards.innerHTML = cards.map(c => `<div class="card"><div class="k">${c.k}</div><div class="v ${c.cls||''}">${c.v}</div><div class="d ${c.cls||''}">${c.d}</div></div>`).join('');
      el.meta.textContent = `Method: ${p.method || ''} | Note: oracle aggregation is a GT-guided upper bound.`;
    }

    function renderRows() {
      const needle = String(el.id.value || '').trim().toLowerCase();
      const sort = el.sort.value;
      const min = Number(el.min.value || 0);
      const max = Number(el.max.value || 1);
      const lim = Math.max(1, Math.min(256, Number(el.n.value || 24)));
      const invOnly = !!el.inv.checked;

      let rows = state.rows.filter(r => {
        const rob = Number(r.iou_inv_robust || 0);
        if (needle && !String(r.image_id || '').toLowerCase().includes(needle)) return false;
        if (rob < min || rob > max) return false;
        if (invOnly && Number(r.used_inversion || 0) !== 1) return false;
        return true;
      });

      if (sort === 'rob_desc') rows.sort((a,b)=>Number(b.iou_inv_robust||0)-Number(a.iou_inv_robust||0));
      if (sort === 'rob_asc') rows.sort((a,b)=>Number(a.iou_inv_robust||0)-Number(b.iou_inv_robust||0));
      if (sort === 'bnd_desc') rows.sort((a,b)=>Number(b.boundary_f1||0)-Number(a.boundary_f1||0));
      if (sort === 'bnd_asc') rows.sort((a,b)=>Number(a.boundary_f1||0)-Number(b.boundary_f1||0));
      if (sort === 'id') rows.sort((a,b)=>String(a.image_id||'').localeCompare(String(b.image_id||''), undefined, {numeric:true}));

      const shown = rows.slice(0, lim);
      el.count.textContent = `Showing ${shown.length} / ${rows.length} filtered (${state.rows.length} total)`;
      if (!shown.length) {
        el.grid.innerHTML = '<div class="empty">No samples match current filters.</div>';
        return;
      }

      el.grid.innerHTML = shown.map((s) => {
        const texList = Array.isArray(s.texture_descriptions) ? s.texture_descriptions : [];
        const selList = Array.isArray(s.selected_prompts) ? s.selected_prompts : [];
        const pms = Array.isArray(s.prompt_masks) ? s.prompt_masks.slice(0, 12) : [];
        const ps = Array.isArray(s.prompt_stats) ? s.prompt_stats : [];
        const texHtml = texList.length ? `<ol class="list">${texList.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>` : '<div class="sub">No texture descriptions found.</div>';
        const selHtml = selList.length ? `<div class="prompts">${selList.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>` : '<div class="sub">No selected prompts.</div>';
        const statsHtml = ps.length ? `<div class="sub">${ps.map(p=>`L${p.label_id} area=${p.mask_area}`).join(' | ')}</div>` : '';
        const pmHtml = pms.length ? `<div class="prompt-grid">${pms.map((u,i)=>`<div class="pm"><img loading="lazy" src="${u}" alt="prompt mask ${i+1}" /><div class="c">p${i+1}</div></div>`).join('')}</div>` : '<div class="sub">No per-prompt masks.</div>';
        const montage = s.prompt_montage ? `<div class="panel"><div class="t">Prompt montage</div><img loading="lazy" src="${s.prompt_montage}" alt="${s.image_id} prompt montage" /></div>` : '';
        return `
          <article class="sample">
            <div class="top">
              <div class="id">${esc(s.image_id)}</div>
              <div class="m">
                <span>IoU <b>${fmt(s.iou,4)}</b></span>
                <span>IoU(inv) <b>${fmt(s.iou_inv,4)}</b></span>
                <span>Robust <b>${fmt(s.iou_inv_robust,4)}</b></span>
                <span>BoundaryF1 <b>${fmt(s.boundary_f1,4)}</b></span>
                <span>ARI <b>${fmt(s.ari,4)}</b></span>
                <span>OracleAgg <b>${fmt(s.oracle_agg_iou_inv_robust,4)}</b></span>
                <span>inv-used <b>${Number(s.used_inversion||0)}</b></span>
              </div>
            </div>
            <div class="quad">
              <div class="panel"><div class="t">Original</div>${s.original ? `<img loading="lazy" src="${s.original}" alt="${s.image_id} original" />` : ''}</div>
              <div class="panel"><div class="t">GT</div>${s.gt_mask ? `<img loading="lazy" src="${s.gt_mask}" alt="${s.image_id} gt" />` : ''}</div>
              <div class="panel"><div class="t">Pred mask</div>${s.pred_mask ? `<img loading="lazy" src="${s.pred_mask}" alt="${s.image_id} mask" />` : ''}</div>
              <div class="panel"><div class="t">Pred edge</div>${s.pred_edge ? `<img loading="lazy" src="${s.pred_edge}" alt="${s.image_id} edge" />` : ''}</div>
              <div class="panel"><div class="t">Binary overlay</div>${s.overlay_binary ? `<img loading="lazy" src="${s.overlay_binary}" alt="${s.image_id} overlay binary" />` : ''}</div>
              <div class="panel"><div class="t">Edge overlay</div>${s.overlay_edges ? `<img loading="lazy" src="${s.overlay_edges}" alt="${s.image_id} overlay edges" />` : ''}</div>
              <div class="panel"><div class="t">Label overlay</div>${s.overlay_labels ? `<img loading="lazy" src="${s.overlay_labels}" alt="${s.image_id} overlay labels" />` : ''}</div>
              ${montage}
            </div>
            <div class="desc">
              <div class="box">
                <h4>VLM texture definitions</h4>
                ${texHtml}
                <div class="sub">backend=${esc(s.vlm_backend || '')}, parse_ok=${s.vlm_parse_ok ? 'true' : 'false'}, num_regions=${s.num_regions_vlm ?? 'n/a'}</div>
              </div>
              <div class="box">
                <h4>OpenWorldSAM prompts</h4>
                ${selHtml}
                ${statsHtml}
                ${pmHtml}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function load() {
      const res = await fetch('./results.json?v=' + Date.now());
      if (!res.ok) throw new Error('Failed loading results.json');
      state.payload = await res.json();
      state.rows = Array.isArray(state.payload.samples) ? state.payload.samples : [];
      renderCards();
      renderRows();
      [el.id, el.sort, el.min, el.max, el.n, el.inv].forEach(n => n.addEventListener('input', renderRows));
      el.sort.addEventListener('change', renderRows);
    }

    load().catch((err) => {
      el.grid.innerHTML = `<div class="empty">Failed to load report: ${String(err.message || err)}</div>`;
      el.count.textContent = 'Load failed';
    });
  </script>
</body>
</html>
